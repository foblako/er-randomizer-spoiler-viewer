name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ER Spoiler Viewer ${{ github.ref_name }}'
          releaseBody: 'Elden Ring Randomizer Spoiler Log Viewer — fast, dark fantasy desktop viewer with virtual scrolling, real-time search, and full entity categorization.'
          releaseDraft: false
          prerelease: false

      - name: Upload portable standalone executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/er_spoiler_viewer.exe") {
            Copy-Item "src-tauri/target/release/er_spoiler_viewer.exe" "Elden-Ring-Spoiler-Viewer-portable.exe"
            gh release upload ${{ github.ref_name }} "Elden-Ring-Spoiler-Viewer-portable.exe" --clobber
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
